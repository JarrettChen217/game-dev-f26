name: Minigame boundaries
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  boundaries:
    name: Minigame submission boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out submitted files for static inspection only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: submitted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check changed paths and inert metadata using trusted code
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python trusted/scripts/minigames.py --root submitted boundary
          --base "$BASE_SHA" --head "$HEAD_SHA" --author "$PR_AUTHOR"
      # Never run, import, install, or source anything from submitted/ here.
