name: Minigame lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  games:
    name: Minigame tests and gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test tooling
        run: python -m unittest discover -s tests -p test_minigame_tools.py -v
      - name: Validate submissions
        run: python scripts/minigames.py check
      - name: Run deterministic game tests without credentials
        run: python scripts/minigames.py test
      - name: Build local gallery
        run: python scripts/minigames.py gallery
      - uses: actions/upload-artifact@v4
        with:
          name: minigame-gallery
          path: build/minigames/
          retention-days: 14
