[project]
name = "tank-trouble-midterm"
version = "1.0.0"
description = "Tank Trouble reconstruction (native60Hz) with a locally trained PPO opponent (u19588)"
requires-python = ">=3.11,<3.13"
dependencies = ["pyxel==2.9.9", "numpy>=2.0,<3", "gymnasium==1.3.0"]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
